; M5Companion - M5GO IoT Kit v2.5 / v2.6 / v2.7 (classic ESP32, 16 MB flash)
[platformio]
default_envs = m5go

[env:m5go]
platform = espressif32@6.12.0
board = m5stack-core-esp32-16M
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.partitions = partitions_16mb.csv
build_type = release
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DM5COMPANION_VERSION=\"0.2.0\"
    -DBOARD_HAS_PSRAM=0
    -Iinclude
    -Isrc
    -O2
lib_deps =
    m5stack/M5Unified@0.2.20
    bblanchon/ArduinoJson@6.21.5
    links2004/WebSockets@2.6.1
    adafruit/Adafruit NeoPixel@1.12.3

; Older 4 MB M5GO units: switch the board to m5stack-core-esp32 and drop the
; custom partition table.
[env:m5go-4mb]
extends = env:m5go
board = m5stack-core-esp32
board_build.partitions = default.csv

; M5Stack CoreS3 / CoreS3 SE. A different machine wearing the same case: an
; ESP32-S3 with PSRAM, an AW88298 amplifier and an ES7210 microphone ADC both on
; I2S, a touch panel instead of the three buttons, and no LED bar. The audio
; workarounds the Core needs are compiled out; see include/Board.hpp.
[env:cores3]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_type = release
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DM5COMPANION_VERSION=\"0.2.0\"
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Iinclude
    -Isrc
    -O2
lib_deps =
    m5stack/M5Unified@0.2.20
    bblanchon/ArduinoJson@6.21.5
    links2004/WebSockets@2.6.1
    adafruit/Adafruit NeoPixel@1.12.3
