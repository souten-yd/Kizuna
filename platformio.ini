; M5Companion - M5Stack CoreS3 (current hardware) and M5GO (legacy hardware)
[platformio]
default_envs = cores3

[env:m5go]
platform = espressif32@6.12.0
board = m5stack-core-esp32-16M
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.partitions = partitions_16mb.csv
build_type = release
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DM5COMPANION_VERSION=\"0.2.0\"
    -DBOARD_HAS_PSRAM=0
    ; Route log_i/log_w/log_e through esp_log_write instead of straight at the
    ; UART.
    ;
    ; Without this, arduino-esp32's log_i() calls log_printf(), which calls
    ; ets_printf() - ROM code writing to the UART registers. It never touches
    ; stdout and never touches esp_log, so esp_log_set_vprintf() cannot see it.
    ; The device demonstrated this the hard way: its web console showed one
    ; line of ESP-IDF driver noise and not a single line the firmware itself
    ; had written, which makes reading the log over the network worthless -
    ; and reading the log over the network is the whole point of it.
    ;
    ; The cost is the message format. ESP_LOG carries a tag rather than
    ; file:line, and esp32-hal-log.h leaves TAG undefined (its default is
    ; commented out at line 192), so one has to be supplied here. Our messages
    ; already name themselves - "recovery: ...", "power: ..." - so the tag is
    ; the cheap half of the trade.
    ; This is not only the write timeout. The library also spends it on the TCP
    ; connect, on the socket read, and - the one that bites - on waiting for the
    ; handshake response (WebSocketsClient.cpp:613). Set to 250 ms it bounded
    ; the write nicely and made the device unable to connect at all: the Python
    ; server's reply does not always land inside a quarter second, so every
    ; attempt was torn down mid-handshake, three times a second, for ever.
    ;
    ; Two seconds instead. Long enough that a handshake is never the thing that
    ; fails, short enough that a dead socket costs one stall rather than five
    ; seconds - and the uplink only ever pays it once per utterance now, since
    ; the first failure makes NetworkManager drop the rest without asking.
    -DWEBSOCKETS_TCP_TIMEOUT=2000
    -Iinclude
    -Isrc
    -O2
; src/recovery is a second, separate program - see [env:recovery]. It has its
; own setup() and would collide with this one's.
build_src_filter = +<*> -<recovery/>
; Applied to src/ only, deliberately: M5GFX has a file with its own TAG, and a
; global -DTAG turns that declaration into a syntax error. Library logs stay on
; the UART where they were; ours become readable over the network, which is the
; half that matters.
build_src_flags =
    -DUSE_ESP_IDF_LOG
    -DTAG=\"m5\"
lib_deps =
    m5stack/M5Unified@0.2.20
    bblanchon/ArduinoJson@6.21.5
    links2004/WebSockets@2.6.1
    adafruit/Adafruit NeoPixel@1.12.3

; The recovery application, in the factory partition.
;
;   pio run -e recovery -t upload
;
; Flashed over USB and never by OTA, which is the entire point of it: it is
; what stays put while the firmware above it is being replaced. It reads a
; known-good image off the SD card and writes it back into app0.
;
; Uploading it also rewrites the bootloader, the partition table and otadata,
; so the device comes back running app0 rather than staying here. Flash the
; main firmware first, then this, and the pair is complete.
;
; app_partition_name is what makes the size check meaningful: without it
; PlatformIO would measure this 500 KB program against app0's four megabytes
; and never tell you it had outgrown its own one-megabyte slot.
[env:recovery]
extends = env:m5go
build_src_filter = -<*> +<recovery/>
board_build.app_partition_name = factory
board_upload.offset_address = 0x810000
lib_deps =
    m5stack/M5Unified@0.2.20

; The same firmware, flashed over Wi-Fi instead of the cable.
;
;   pio run -e m5go_ota -t upload --upload-port 192.168.68.66
;
; The device answers espota on port 3232 whenever its web console is up, which
; is whenever Wi-Fi is. mDNS also works, but the name it advertises is
; `device_name` from device.json - the firmware hands that straight to
; ArduinoOTA.setHostname - so the default below is only right for a device
; still called M5GO-Companion. An address is one fewer thing to go wrong, and
; the address is on the device's own status page.
;
; Add `--auth=<password>` to upload_flags if `ota_password` is set on the
; device. Neither side warns about a mismatch in a useful way; the upload just
; fails at the handshake.
[env:m5go_ota]
extends = env:m5go
upload_protocol = espota
upload_port = M5GO-Companion.local
upload_flags =
    --port=3232

; Older 4 MB M5GO units: switch the board to m5stack-core-esp32 and drop the
; custom partition table.
[env:m5go-4mb]
extends = env:m5go
board = m5stack-core-esp32
board_build.partitions = default.csv

; M5Stack CoreS3 / CoreS3 SE. A different machine wearing the same case: an
; ESP32-S3 with PSRAM, an AW88298 amplifier and an ES7210 microphone ADC both on
; I2S, a touch panel instead of the three buttons, and no LED bar. The audio
; workarounds the Core needs are compiled out; see include/Board.hpp.
[env:cores3]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_type = release
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DM5COMPANION_VERSION=\"0.2.0\"
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Iinclude
    -Isrc
    -O2
build_src_filter = +<*> -<recovery/>
lib_deps =
    m5stack/M5Unified@0.2.20
    bblanchon/ArduinoJson@6.21.5
    links2004/WebSockets@2.6.1
    adafruit/Adafruit NeoPixel@1.12.3

[env:cores3_ota]
extends = env:cores3
upload_protocol = espota
upload_port = CoreS3-Companion.local
upload_flags =
    --port=3232
